# Local bench broker. The ESP32 publishes here; the hub only subscribes.
# Do not forward port 1883 on the router — this is LAN-only, no password yet.
# If the page banner says "MQTT broker not connected", start this config:
#   mosquitto -c config/mosquitto.conf
# or: docker compose up -d
# On the owner's Windows PC, Mosquitto often already runs as a service on 1883.

listener 1883              # MQTT port the node, simulator, and hub all use
allow_anonymous true       # Phase 1 bench on the home LAN; no login yet
persistence false          # Do not keep old retained messages across a broker restart
